<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERAQA | The Future Packaging</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-1: #0ABAB5; /* Teal */
            --color-2: #56DFCF; /* Light Sea Green */
            --color-3: #ADEED9; /* Mint */
            --color-4: #FFEDF3; /* Blush Pink */
            
            --text-main: #0B3B39;
            --text-muted: #1A5E5B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--color-3); /* Prevents any white gaps */
        }

        /* --- Ambient Atmospheric Background --- */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.8;
            animation: drift 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            width: 70vw;
            height: 70vw;
            background: var(--color-1);
            animation-delay: 0s;
        }

        .blob-2 {
            bottom: -20%;
            right: -10%;
            width: 80vw;
            height: 80vw;
            background: var(--color-4);
            animation-delay: -5s;
            animation-duration: 25s;
        }

        .blob-3 {
            top: 20%;
            right: -20%;
            width: 60vw;
            height: 60vw;
            background: var(--color-2);
            animation-delay: -10s;
            animation-duration: 22s;
        }

        .blob-4 {
            bottom: -10%;
            left: 10%;
            width: 65vw;
            height: 65vw;
            background: var(--color-3);
            animation-delay: -15s;
            animation-duration: 18s;
        }

        /* Subtle Grain Texture overlay */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04;
            mix-blend-mode: multiply;
            pointer-events: none;
            z-index: 2;
        }

        /* --- Main Layout --- */
        .content-wrapper {
            position: relative;
            z-index: 10;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            perspective: 1000px;
        }

        /* --- Premium Glassmorphism Card --- */
        .glass-card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            border-left: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 
                0 30px 60px rgba(10, 50, 50, 0.1), 
                inset 0 0 0 1px rgba(255, 255, 255, 0.2);
            border-radius: 32px;
            padding: 64px 48px;
            max-width: 640px;
            width: 100%;
            text-align: center;
            animation: cardEntrance 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards, 
                       float 6s ease-in-out infinite alternate;
            transform-style: preserve-3d;
        }

        /* --- Typography & Content --- */
        .logo {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text-main);
            margin-bottom: 4px;
            background: linear-gradient(135deg, #0B3B39 0%, #0ABAB5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sub-logo {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--color-1);
            margin-bottom: 24px;
        }

        .tagline {
            font-size: 1.5rem;
            font-weight: 400;
            line-height: 1.4;
            color: var(--text-main);
            margin-bottom: 20px;
            letter-spacing: -0.01em;
        }

        .description {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 40px;
            max-width: 90%;
            margin-left: auto;
            margin-right: auto;
        }

        /* --- Form Elements --- */
        .notify-form {
            display: flex;
            gap: 12px;
            max-width: 480px;
            margin: 0 auto;
        }

        .notify-form input {
            flex: 1;
            padding: 16px 24px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.5);
            font-size: 1rem;
            color: var(--text-main);
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
        }

        .notify-form input::placeholder {
            color: rgba(26, 94, 91, 0.6);
        }

        .notify-form input:focus {
            background: rgba(255, 255, 255, 0.8);
            border-color: var(--color-1);
            box-shadow: 0 0 0 4px rgba(10, 186, 181, 0.15);
        }

        .notify-form button {
            padding: 16px 32px;
            border-radius: 16px;
            border: none;
            background: var(--text-main);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(11, 59, 57, 0.15);
            white-space: nowrap;
        }

        .notify-form button:hover {
            background: #0ABAB5;
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(10, 186, 181, 0.25);
        }

        /* --- Animations --- */
        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(5%, 5%) scale(1.05); }
            66% { transform: translate(-5%, 8%) scale(0.95); }
            100% { transform: translate(8%, -5%) scale(1); }
        }

        @keyframes cardEntrance {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-12px); }
        }

        /* --- Responsive Design --- */
        @media (max-width: 600px) {
            .glass-card {
                padding: 48px 24px;
                border-radius: 24px;
            }
            
            .logo {
                font-size: 2.5rem;
            }

            .sub-logo {
                font-size: 0.8rem;
            }
            
            .tagline {
                font-size: 1.25rem;
            }
            
            .notify-form {
                flex-direction: column;
            }
            
            .notify-form button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Atmospheric Mesh Background -->
    <div class="background-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
        <div class="noise-overlay"></div>
    </div>

    <!-- Centered Glass Card -->
    <main class="content-wrapper">
        <div class="glass-card">
            <h1 class="logo">VERAQA</h1>
            <p class="sub-logo">The Future Packaging</p>
            <h2 class="tagline">Creating packaging solutions inspired by nature that is designed for future brands.</h2>
            <p class="description">Join the waitlist and be among the first to experience packaging that elevates your brand while reducing environmental impact.</p>
            
            <form class="notify-form" onsubmit="event.preventDefault();">
                <input type="email" placeholder="Enter your email address" required aria-label="Email Address">
                <button type="submit">Join Waitlist</button>
            </form>
        </div>
    </main>

</body>
</html>
